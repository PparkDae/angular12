<div class="register-form">
  <h2>회원가입</h2>
  
  <!-- 에러 메시지 표시 -->
  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  
  <!-- 성공 메시지 표시 -->
  <div class="success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>
  
  <form (ngSubmit)="onRegister()" #registerForm="ngForm">
    <input 
      type="text" 
      name="userid" 
      [(ngModel)]="userId" 
      placeholder="아이디" 
      required 
      [disabled]="loading"
    />
    <input 
      type="text" 
      name="username" 
      [(ngModel)]="username" 
      placeholder="이름" 
      required 
      [disabled]="loading"
    />
    <input 
      type="password" 
      name="password" 
      [(ngModel)]="password" 
      placeholder="비밀번호" 
      required 
      [disabled]="loading"
    />
    <input 
      type="email" 
      name="email" 
      [(ngModel)]="email" 
      placeholder="이메일" 
      required 
      [disabled]="loading"
    />
    <button 
      type="submit" 
      [disabled]="!registerForm.valid || loading"
      class="register-btn"
    >
      <span *ngIf="!loading">회원가입</span>
      <span *ngIf="loading">회원가입 중...</span>
    </button>
    <button type="button" [routerLink]="['/login']" [disabled]="loading">
      로그인으로 돌아가기
    </button>
  </form>
</div>
